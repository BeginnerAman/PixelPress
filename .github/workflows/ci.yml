name: PixelPress Desktop Pro CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Test Suite (Python ${{ matrix.python-version }} on Windows)
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Set up Node.js for client assets check
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install Desktop Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-desktop.txt
        pip install pytest

    - name: Validate Client JavaScript Syntax
      run: |
        node -c static/js/main.js

    - name: Run Full Pytest Test Suite
      run: |
        pytest -v tests/

    - name: Validate PyInstaller Spec Syntax
      run: |
        python -c "import PyInstaller; print('PyInstaller available for build')"
        python -m py_compile launcher.py app.py
